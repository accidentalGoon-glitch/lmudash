version: '3.8'
services:
  db:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_USER: lemans
      POSTGRES_PASSWORD: lemans
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://lemans:lemans@db:5432/telemetry
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND: http://backend:4000
    ports:
      - "8080:80"
    depends_on:
      - backend

  simulator:
    build:
      context: ./backend
    command: ["node", "simulator.js"]
    environment:
      - BACKEND=http://backend:4000
    depends_on:
      - backend

volumes:
  db-data:
